name: Publicar release v2

on:
  push:
    branches:
      - web/v2.0

permissions:
  contents: write

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'release: v2.0.0' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Obter versão aprovada
        uses: actions/checkout@v4
        with:
          ref: ec54f95feaaee3d0c60be49a05920c8a641f6385
          fetch-depth: 0

      - name: Validar versão
        shell: bash
        run: |
          grep -q 'version = "2.0.0"' pyproject.toml
          grep -q '__version__ = "2.0.0"' nfe_consulta/__init__.py

      - name: Montar pacote de instalação
        shell: bash
        run: |
          PACKAGE="ConsultaManifestacao_DFE-v2.0.0"
          mkdir -p "dist/$PACKAGE"
          rsync -a ./ "dist/$PACKAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='dist/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='dados/*' \
            --exclude='secrets/*' \
            --exclude='logs/*'
          mkdir -p "dist/$PACKAGE/dados" "dist/$PACKAGE/secrets" "dist/$PACKAGE/logs"
          (
            cd dist
            zip -r "$PACKAGE.zip" "$PACKAGE"
          )

      - name: Criar notas da release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Consulta de Manifestação v2.0.0

          Primeira versão Web corporativa da aplicação.

          ### Principais recursos
          - Interface Web com modo claro e escuro.
          - Geração de Excel a partir de CHAVES.txt usando somente o banco central.
          - Consulta rápida de manifestações por número da NF.
          - Tela de Status com ultNSU, maxNSU e disponibilidade da próxima sincronização.
          - Área Atualizar protegida por login administrativo.
          - Seleção e validação do banco SQLite/SQLCipher pela área administrativa.
          - Seleção e validação de certificado A1 PFX/P12 pela área administrativa.
          - Sincronização NFeDistribuicaoDFe com cooldown persistente.
          - Job para atualização matinal pelo Agendador de Tarefas do Windows.
          - Logs de auditoria e proteções CSRF/headers de segurança.
          - Preparada para publicação interna atrás de IIS/HTTPS.

          ### Instalação
          1. Extraia o ZIP em uma pasta definitiva, por exemplo C:\ConsultaManifestacao.
          2. Execute INSTALAR.cmd.
          3. Configure o login administrativo com CONFIGURAR_ADMIN.cmd.
          4. Inicie com INICIAR_WEB.cmd.
          5. Na área Atualizar, aponte o banco central e o certificado A1.

          ### Segurança
          O pacote não contém banco de dados, senhas, certificado A1 ou outros segredos.
          EOF

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v2.0.0 \
            "dist/ConsultaManifestacao_DFE-v2.0.0.zip#ConsultaManifestacao_DFE-v2.0.0.zip" \
            --target ec54f95feaaee3d0c60be49a05920c8a641f6385 \
            --title "Consulta de Manifestação v2.0.0" \
            --notes-file release-notes.md
