name: CI

on:
  push:
    branches:
      - web/v2.0
      - web/v2.1
  pull_request:
    branches:
      - main
      - refactor/v1.0
      - web/v2.0
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validar sintaxe e imports
        run: |
          python -m compileall -q nfe_consulta
          python -c "import nfe_consulta.web.app"

      - name: Executar testes
        run: python -m pytest -q

  test-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validar runtime Windows
        shell: pwsh
        run: |
          python -m compileall -q nfe_consulta
          python -c "import nfe_consulta; import nfe_consulta.certificado_windows; import nfe_consulta.web.app; import nfe_consulta.relatorio_eventos"
          python -c "import nfe_consulta; print(nfe_consulta.__version__)"

      - name: Executar testes
        shell: pwsh
        run: python -m pytest -q
