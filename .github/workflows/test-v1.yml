name: Testes v2 Web

on:
  push:
    branches:
      - web/v2.0
  pull_request:
    branches:
      - main
      - refactor/v1.0
  workflow_dispatch:
  schedule:
    # 08:00 em Brasília (UTC-3). Passa a valer quando esta versão estiver na branch padrão.
    - cron: "0 11 * * *"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verificar sintaxe e imports
        run: |
          python -m compileall -q nfe_consulta
          python -c "import nfe_consulta.web.app"

      - name: Rodar testes
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar projeto
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verificar runtime Windows
        shell: pwsh
        run: |
          python -m compileall -q nfe_consulta
          python -c "import tkinter; import nfe_consulta.gui; import nfe_consulta.certificado_windows; import nfe_consulta.web.app"
          python -m nfe_consulta.cli --version
          python -m nfe_consulta.cli --help

      - name: Rodar testes
        shell: pwsh
        run: python -m pytest -q
