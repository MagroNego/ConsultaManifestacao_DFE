[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-consulta"
version = "2.0.0.dev0"
description = "Consulta corporativa de manifestacoes de NF-e"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luan" }]
dependencies = [
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7.1,<1",
    "sqlcipher3==0.6.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1"]

[project.scripts]
nfe-consulta = "nfe_consulta.cli:main"
nfe-consulta-web = "nfe_consulta.web.app:main"

[tool.setuptools.packages.find]
include = ["nfe_consulta*"]

[tool.setuptools.package-data]
"nfe_consulta.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
