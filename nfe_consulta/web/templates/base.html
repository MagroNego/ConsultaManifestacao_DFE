<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Consulta de Manifestação{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ version }}-items-detail-13">
  <script src="{{ url_for('static', path='/downloads_ui.js') }}?v={{ version }}-items-detail-13" defer></script>
  <script src="{{ url_for('static', path='/app.js') }}?v={{ version }}-items-detail-13" defer></script>
  <script src="{{ url_for('static', path='/items_navigation.js') }}?v={{ version }}-items-detail-13" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-logo-link" href="{{ url_for('consulta_page') }}" aria-label="Yorozu">
        <img class="brand-logo brand-logo-light" src="{{ url_for('static', path='/img/yorozu-light.png') }}" alt="Yorozu">
        <img class="brand-logo brand-logo-dark" src="{{ url_for('static', path='/img/yorozu-dark.png') }}" alt="Yorozu">
      </a>
      <div class="brand-copy">
        <strong>Consulta de Manifestação</strong>
      </div>
    </div>

    <nav class="tabs" aria-label="Navegação principal">
      <a href="{{ url_for('consulta_page') }}" class="{% if request.url.path == '/' or request.url.path.startswith('/consulta') %}active{% endif %}">Consulta</a>
      <a href="{{ url_for('status_page') }}" class="{% if request.url.path.startswith('/status') %}active{% endif %}">Status</a>
      <a href="{{ url_for('xml_page') }}" class="{% if request.url.path.startswith('/xml') %}active{% endif %}">Emissão</a>
      <a href="{{ url_for('downloads_page') }}" class="{% if request.url.path.startswith('/downloads') %}active{% endif %}">Downloads</a>
      <a href="{{ url_for('atualizar_page') }}" class="{% if request.url.path.startswith('/atualizar') or request.url.path.startswith('/admin/login') %}active{% endif %}">Admin</a>
    </nav>

    <div class="account">
      <div class="notifications">
        <button class="theme-toggle notification-bell" type="button" data-notification-bell aria-label="Notificações" aria-expanded="false" aria-controls="notification-panel">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="notification-count" data-notification-count hidden>0</span>
        </button>
        <section id="notification-panel" class="notification-panel" data-notification-panel data-downloads-url="{{ url_for('downloads_page') }}" data-state-url="{{ url_for('downloads_state') }}" aria-label="Notificações recentes" hidden>
          <div class="notification-heading"><strong>Notificações</strong><button type="button" data-notification-clear>Limpar</button></div>
          <ul data-notification-list><li class="notification-empty">Nenhuma notificação recente.</li></ul>
        </section>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
        <span data-theme-icon>◐</span>
      </button>
      {% if user.is_admin %}
      <form action="{{ url_for('admin_logout') }}" method="post" class="logout-form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="logout-button">Sair do Admin</button>
      </form>
      {% endif %}
    </div>
  </header>

  <div class="notification-toast" data-notification-toast role="status" aria-live="polite" hidden></div>

  <main class="page{% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
