<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Consulta de Manifestação{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">DF</span>
      <div>
        <strong>Consulta de Manifestação</strong>
        <small>NF-e · v{{ version }}</small>
      </div>
    </div>

    {% if user %}
    <nav class="tabs" aria-label="Navegação principal">
      <a href="{{ url_for('excel_page') }}" class="{% if request.url.path == '/' or request.url.path.startswith('/consulta') %}active{% endif %}">Excel</a>
      <a href="{{ url_for('status_page') }}" class="{% if request.url.path.startswith('/status') %}active{% endif %}">Status</a>
      {% if user.is_admin %}
      <a href="{{ url_for('atualizar_page') }}" class="{% if request.url.path.startswith('/atualizar') %}active{% endif %}">Atualizar</a>
      {% endif %}
    </nav>

    <div class="account">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
        <span data-theme-icon>◐</span>
      </button>
      <div class="user-chip">
        <strong>{{ user.display_name }}</strong>
        <small>{{ "Administrador" if user.is_admin else "Usuário" }}</small>
      </div>
    </div>
    {% endif %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
