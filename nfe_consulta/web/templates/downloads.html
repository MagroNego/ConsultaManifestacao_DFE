{% extends "base.html" %}
{% block title %}Downloads{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <h1>Downloads</h1>
    <p>Arquivos disponíveis por 24 horas após a geração.</p>
  </div>
</section>
<section class="card consultation-card">
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <div data-downloads-table data-state-url="{{ url_for('downloads_state') }}">{% include 'downloads_table.html' %}</div>
</section>
{% endblock %}
