{% macro password_field(id, label, username='') %}
<div class="field">
  <label for="{{ id }}">{{ label }}</label>
  <div class="password-control">
    <input id="{{ id }}" type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password"{% if username %} aria-label="Nova senha de {{ username }}"{% endif %}>
    <button type="button" class="password-toggle" data-password-toggle aria-controls="{{ id }}" aria-pressed="false" aria-label="Mostrar {{ label|lower }}{% if username %} de {{ username }}{% endif %}">Mostrar</button>
  </div>
</div>
{% endmacro %}
